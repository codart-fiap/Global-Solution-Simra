<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar Ocorrência</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>

<div class="container-principal">

    <nav class="navbar navbar-expand-lg border-bottom">

        <div class="container-fluid">

          <a class="navbar-brand ms-2" href="#"><img src="../img/logoSimra.svg" width="180" height="45" alt="Logo"></a>

          <div class="collapse navbar-collapse row-gap-5 justify-content-end" id="navbarNav">

                <ul class="navbar-nav d-flex align-items-center gap-3 fs-5">

                    <li class="nav-item">
                        <a class="nav-link"  href="#">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link"  href="#">Sensores</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Alertas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Ocorrências</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <button type="button" class="btn btn-secondary btn-md border-0 rounded">
                                <i class="fa-regular fa-bell"></i>
                            </button>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <button type="button" class="btn btn-secondary btn-md border-0 rounded-circle">
                                <i class="fa-regular fa-user"></i>
                            </button>
                        </a>
                    </li>
        
                </ul>

          </div>
          
        </div>
    </nav>


    <div class="container mt-5">
    <h1 class="fw-bold texto-principal">Reportar Ocorrência</h1>

    <div class="col-sm-6">

        <form action="" class="was-validated">

            <div class="mb-3 mt-5">
              <label for="uname" class="form-label fw-semibold">Localização</label>
              <input type="uname" class="form-control" id="name" name="uname" required placeholder="Digite  o endereço ou selecione no mapa">
              <div class="invalid-feedback">Preencha a localização.</div>
            </div>
    
            <div class="mb-3">
              <label class="form-label fw-semibold">Descrição da ocorrência</label>
              <textarea class="form-control" id="desc" name="description" required rows="10"></textarea>
              <div class="invalid-feedback">Informe a descrição</div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Tipo de ajuda</label>
                <textarea class="form-control" id="desc" name="description" required rows="1"></textarea>
                <div class="invalid-feedback">Informe o tipo de ajuda</div>
              </div>

            <hr class="mt-5">

            <div class="row">
                <div class="col-sm-12">
                    <button type="submit" class="btn btn-primary">Enviar</button>
                </div>
            </div>

          </form>
    </div>


    </div>

</div>

</body>

</html>
