<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Abrigos</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>

<div class="container-principal">

    <nav class="navbar navbar-expand-lg border-bottom">

        <div class="container-fluid">

          <a class="navbar-brand ms-2" href="#"><img src="../img/logoSimra.svg" width="180" height="45" alt="Logo"></a>

          <div class="collapse navbar-collapse row-gap-5 justify-content-end" id="navbarNav">

                <ul class="navbar-nav d-flex align-items-center gap-3 fs-5">

                    <li class="nav-item">
                        <a class="nav-link"  href="#">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link"  href="#">Sensores</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Alertas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Ocorrências</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <button type="button" class="btn btn-secondary btn-md border-0 rounded">
                                <i class="fa-regular fa-bell"></i>
                            </button>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <button type="button" class="btn btn-secondary btn-md border-0 rounded-circle">
                                <i class="fa-regular fa-user"></i>
                            </button>
                        </a>
                    </li>
        
                </ul>

          </div>
          
        </div>
    </nav>


    <div class="container mt-5">
    <h1 class="fw-bold texto-principal">Gerenciamento de Abrigos</h1>
    <h2 class="fw-bold fs-3 texto-principal mt-5 mb-4">Ações em abrigos</h2>
        <a class="nav-link" href="#">
            <button type="button" class="btn btn-primary fw-semibold btn-lg rounded-pill">
                <i class="fa-regular fa-bookmark me-2 text-white"></i>Listar abrigos
            </button>
        </a>

        <a class="nav-link" href="#">
            <button type="button" class="btn btn-secondary border-0 fw-semibold text-dark btn-lg mt-4 rounded-pill">
                <i class="fa-regular fa-square-plus me-2"></i>Registrar um novo abrigo
            </button>
        </a>

        <h2 class="fw-bold fs-3 texto-principal mt-5 mb-4">Gestão de pessoas</h2>
        <a class="nav-link" href="#">
            <button type="button" class="btn btn-primary fw-semibold btn-lg rounded-pill">
                <i class="fa-regular fa-square-plus me-2 text-white"></i>Registrar pessoa em um abrigo
            </button>
        </a>

        <a class="nav-link" href="#">
            <button type="button" class="btn btn-secondary border-0 fw-semibold text-dark btn-lg mt-4 rounded-pill">
                <i class="fa-regular fa-address-card me-2"></i>Listar pessoas em um abrigo
            </button>
        </a>

        <a class="nav-link" href="#">
            <button type="button" class="btn btn-secondary border-0 fw-semibold text-dark btn-lg mt-4 rounded-pill">
                <i class="fa-regular fa-square-minus me-2"></i>Remover uma pessoa de um abrigo
            </button>
        </a>

        <h2 class="fw-bold fs-3 texto-principal mt-5 mb-4">Operações de abrigo</h2>
        <a class="nav-link" href="#">
            <button type="button" class="btn btn-primary fw-semibold btn-lg rounded-pill">
                <i class="fa-regular fa-pen-to-square me-2 text-white"></i>Atualizar informações
            </button>
        </a>

        <a class="nav-link" href="#">
            <button type="button" class="btn btn-secondary border-0 fw-semibold text-dark btn-lg mt-4 rounded-pill">
                <i class="fa-regular fa-rectangle-xmark me-2"></i>Remover um abrigo
            </button>
        </a>

    

    </div>

</div>

</body>

</html>
